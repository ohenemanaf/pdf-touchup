name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: choco install tesseract innosetup -y --no-progress
      - name: Install app
        run: pip install -e .[dev]
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PDF_TOUCHUP_TESSERACT: C:\Program Files\Tesseract-OCR
        run: pytest -q
      - name: Build app folder
        shell: pwsh
        run: |
          ./packaging/fetch_tessdata.ps1
          python packaging/make_sample.py build/sample/scanned.pdf
          pyinstaller packaging/pdf_touchup.spec --noconfirm --distpath dist --workpath build/pyi
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process dist/PDFTouchup/PDFTouchup.exe -ArgumentList "--self-test","build/sample/scanned.pdf" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged self-test failed ($($p.ExitCode))" }
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PDF-Touchup-Setup-*.exe

  macos:
    runs-on: macos-latest
    continue-on-error: true  # best effort for v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          brew install tesseract
          mkdir -p packaging/vendor/tesseract/tessdata
          cp "$(brew --prefix)/share/tessdata/eng.traineddata" packaging/vendor/tesseract/tessdata/
          pip install -e .[dev]
          pyinstaller packaging/pdf_touchup.spec --noconfirm --distpath dist --workpath build/pyi
          version="${GITHUB_REF_NAME#v}"
          hdiutil create -volname "PDF Touch-up" -srcfolder "dist/PDF Touch-up.app" -ov -format UDZO "dist/PDF-Touchup-$version.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/PDF-Touchup-*.dmg

  release:
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
