[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-touchup"
version = "0.1.0"
description = "Free, offline small text fixes for normal and scanned PDFs"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24", "numpy>=1.26", "pyside6>=6.7"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller>=6"]

[project.gui-scripts]
pdf-touchup = "pdf_touchup.ui.app:main"

[tool.setuptools.packages.find]
include = ["pdf_touchup*"]
namespaces = true

[tool.setuptools.package-data]
pdf_touchup = ["fonts/*", "tessdata/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: needs Tesseract"]
